{% extends "base.html" %}

{% block title %}Todo List - Todo App{% endblock %}

{% block content %}
<h2>Add New Todo</h2>
<form method="post">
  <input type="text" name="todo" required>
  <button type="submit">Add Todo</button>

  <input type="text" name="todo" placeholder="할 일" required>
  <input type="text" name="note" placeholder="설명">
  <button type="submit">Add Todo</button>

</form>

<h2>Todo List</h2>
{% if todos %}
<ul>
  {% for todo in todos %}
  <li>
    {{ todo }}
    <a href="{{ url_for('delete', id=todo.id) }}">삭제</a>
  </li>
  {% endfor %}
</ul>
{% else %}
<p>No todos yet. Add some!</p>
{% endif %}
{% endblock %}
